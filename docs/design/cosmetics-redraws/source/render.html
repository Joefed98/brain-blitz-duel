<!doctype html>
<!-- Joulz cosmetics redraws renderer (phase 2 step 4): the art kit's raymarcher (docs/design/style-guide/source/art.html), its
     gloss material (style 1) and one key light from the top left, with the cosmetics' own scenes. render.ts drives
     window.renderArt(). Was: Joulz art kit renderer (round 1 sketch). One raymarched 3D scene per icon, one key light from the
     top left, three material styles: 0 clay (matte, soft), 1 gloss (vinyl toy), 2 toon (stepped, outlined).
     render.mjs drives window.renderArt() and saves PNGs; nothing here is app code. -->
<meta charset="utf-8"><canvas id="c"></canvas>
<script id="fs" type="x-shader">#version 300 es
precision highp float;
out vec4 o;
uniform vec2 uRes; uniform int uScene; uniform int uStyle;
uniform vec3 uCol[8]; uniform float uYaw, uPitch, uZoom, uGround, uLookY; 

mat3 rotY(float a){float c=cos(a),s=sin(a);return mat3(c,0,-s,0,1,0,s,0,c);}
mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1,0,0,0,c,s,0,-s,c);}
mat3 rotZ(float a){float c=cos(a),s=sin(a);return mat3(c,s,0,-s,c,0,0,0,1);}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
vec2 U(vec2 a,vec2 b){return a.x<b.x?a:b;}
float sdSphere(vec3 p,float r){return length(p)-r;}
float sdRBox(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}
float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float sdRCyl(vec3 p,float r,float h,float rr){vec2 d=vec2(length(p.xz)-r+rr,abs(p.y)-h+rr);return min(max(d.x,d.y),0.)+length(max(d,0.))-rr;}
float sdRCylZ(vec3 p,float r,float h,float rr){return sdRCyl(p.xzy,r,h,rr);}
float sdTorusZ(vec3 p,float R,float r){vec2 q=vec2(length(p.xy)-R,p.z);return length(q)-r;}
float sdPoly(vec2 p,vec2 v[10],int n){float d=dot(p-v[0],p-v[0]);float s=1.;
 for(int i=0,j=n-1;i<n;j=i,i++){vec2 e=v[j]-v[i];vec2 w=p-v[i];vec2 b=w-e*clamp(dot(w,e)/dot(e,e),0.,1.);d=min(d,dot(b,b));
  bvec3 c=bvec3(p.y>=v[i].y,p.y<v[j].y,e.x*w.y>e.y*w.x);if(all(c)||all(not(c)))s*=-1.;}return s*sqrt(d);}
float extrude(float d2,float z,float h,float r){vec2 w=vec2(d2+r,abs(z)-h+r);return min(max(w.x,w.y),0.)+length(max(w,0.))-r;}
float sdBolt(vec3 p,float s,float h){vec2 v[10];
 v[0]=vec2(-.075,1.);v[1]=vec2(.425,1.);v[2]=vec2(.075,.2);v[3]=vec2(.425,.2);v[4]=vec2(-.325,-1.);v[5]=vec2(-.075,-.1);v[6]=vec2(-.425,-.1);
 return extrude(sdPoly(p.xy/s,v,7)*s,p.z,h,.05);}
float sdStar(vec3 p,float s,float h){vec2 v[10];for(int i=0;i<10;i++){float a=1.5708+float(i)*.6283;float r=(i%2==0)?1.:.45;v[i]=vec2(cos(a),sin(a))*r;}
 return extrude(sdPoly(p.xy/s,v,10)*s,p.z,h,.03);}
float sdShield(vec3 p,float h){vec2 v[10];v[0]=vec2(-.78,.88);v[1]=vec2(.78,.88);v[2]=vec2(.76,.05);v[3]=vec2(.42,-.6);v[4]=vec2(0.,-.95);v[5]=vec2(-.42,-.6);v[6]=vec2(-.76,.05);
 return extrude(sdPoly(p.xy,v,7),p.z,h,.1);}
float sdGem(vec3 p){float d=length(p.xz)-.95;d=max(d,p.y-.42);
 for(int i=0;i<8;i++){float a=float(i)*.7854;d=max(d,dot(p,normalize(vec3(cos(a),-.78,sin(a))))-.5);
  d=max(d,dot(p,normalize(vec3(cos(a+.3927),.95,sin(a+.3927))))-.66);}return d;}



float hash1(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float sdHexP(vec3 p,float r,float h){vec3 k=vec3(-.8660254,.5,.57735);vec2 q=abs(p.xz);q-=2.*min(dot(k.xy,q),0.)*k.xy;
 vec2 d=vec2(length(q-vec2(clamp(q.x,-k.z*r,k.z*r),r))*sign(q.y-r),abs(p.y)-h);return min(max(d.x,d.y),0.)+length(max(d,0.));}
float sdCrown(vec3 p){
 float b=sdRCyl(p-vec3(0,-.35,0),.62,.16,.06);
 float body=sdRCyl(p-vec3(0,-.05,0),.58,.32,.04);
 body=max(body,-sdRCyl(p-vec3(0,.05,0),.5,.5,.02));
 float a=atan(p.z,p.x);float sec=6.2832/5.;float aa=mod(a+sec*.5,sec)-sec*.5;vec2 r2=vec2(cos(aa),sin(aa))*length(p.xz);
 vec3 q=vec3(r2.x,p.y,r2.y);
 float pk=sdCap(q,vec3(.55,.1,0),vec3(.62,.62,0),.07);float ball=sdSphere(q-vec3(.63,.7,0),.1);
 float c=min(min(b,body),min(pk,ball));
 c=max(c,-(length(p.xz)-.47));
 return c;}
// uVar: which variant of a scene.
uniform float uVar;
vec2 scene(vec3 p){
 vec2 r=vec2(1e9,0.);
 if(uScene==0){ // the bolt
  r=vec2(sdBolt(p,1.,.2),0.);}
 else if(uScene==1){ // bolt stripes: diagonal bars, a bolt between
  vec3 q=rotZ(-.75)*p; float cell=.62; float id=floor(q.x/cell+.5); q.x-=cell*id;
  float bar=sdRBox(q,vec3(.16,3.,.12),.08); r=vec2(bar,mod(id,2.)==0.?1.:2.);
  r=U(r,vec2(sdBolt(rotZ(.15)*(p-vec3(.2,0,.45)),.62,.16),0.));}
 else if(uScene==2){ // grid of rounded tiles
  vec3 q=p; vec2 id=floor(q.xz/.5+.5); q.xz-=.5*id; float h=.06+.05*hash1(id);
  float lit=hash1(id+7.)>.84?3.:1.; r=vec2(sdRBox(q-vec3(0,h,0),vec3(.2,h,.2),.05),lit);}
 else if(uScene==3){ // domes
  vec3 q=p; vec2 id=floor(q.xz/.44+.5); q.xz-=.44*id; float lit=hash1(id+3.)>.82?3.:1.;
  r=vec2(max(sdSphere(q,.17),-q.y),lit);}
 else if(uScene==4){ // three glossy wave ribbons
  for(int i=0;i<3;i++){float fi=float(i);vec3 q=p-vec3(0,.55-fi*.55,-fi*.15);
   float w=q.y-.16*sin(q.x*2.6+fi*1.3)-.05*sin(q.x*5.+fi);
   float d=max(abs(w)-.07,abs(q.z)-.55); d=max(d,abs(q.x)-4.); r=U(r,vec2(d*.7,fi==1.?2.:1.));}}
 else if(uScene==5){ // hex prisms
  vec3 q=p; vec2 c=vec2(.9,1.5588); vec2 a=mod(q.xz,c)-c*.5; vec2 b=mod(q.xz-c*.5,c)-c*.5;
  vec2 g=dot(a,a)<dot(b,b)?a:b; vec2 id=floor((q.xz-g)/.45+.5);
  float h=.08+.18*hash1(id); float lit=hash1(id+11.)>.8?3.:1.;
  r=vec2(sdHexP(vec3(g.x,q.y-h,g.y),.38,h)-.03,lit);}
 else if(uScene==6){ // sunburst: rays round a glossy sun
  float a=atan(p.y,p.x); float sec=6.2832/20.; float k=floor(a/sec+.5); float aa=a-k*sec;
  vec2 q2=vec2(cos(aa),sin(aa))*length(p.xy); vec3 q=vec3(q2,p.z);
  float wdt=.05+.09*clamp((q2.x-.55)/1.6,0.,1.);r=vec2(sdRBox(q-vec3(1.45,0,-.1),vec3(.9,wdt,.06),.04),mod(k,2.)==0.?1.:2.);
  r=U(r,vec2(sdSphere(p,.5),0.));}
 else if(uScene==7){ // tier emblems
  int v=int(uVar+.5);
  if(v==0){r=vec2(sdBolt(p,.85,.16),0.);r=U(r,vec2(sdSphere(p-vec3(.62,.55,.1),.12),3.));r=U(r,vec2(sdSphere(p-vec3(-.6,-.45,.1),.09),3.));r=U(r,vec2(sdSphere(p-vec3(.55,-.7,0),.07),3.));}
  else if(v==1){r=vec2(sdRBox(p,vec3(.5,.82,.32),.22),1.);r=U(r,vec2(sdRCyl(p-vec3(0,.92,0),.18,.08,.04),3.));r=U(r,vec2(sdBolt(p-vec3(0,0,.33),.48,.08),0.));}
  else if(v==2){r=vec2(sdTorusZ(p,.82,.13),1.);r=U(r,vec2(sdBolt(p,.66,.16),0.));}
  else if(v==3){r=vec2(sdBolt(p-vec3(0,.05,.2),.72,.15),0.);
   for(int i=0;i<2;i++){float fi=float(i);vec3 q=p-vec3(0,-.55-fi*.28,-.1);float w=q.y-.1*sin(q.x*4.+fi*2.);float d=max(abs(w)-.055,abs(q.z)-.18);d=max(d,abs(q.x)-1.);r=U(r,vec2(d*.7,1.));}}
  else if(v==4){float c=smin(smin(sdSphere(p-vec3(-.38,.25,0),.4),sdSphere(p-vec3(.15,.42,0),.5),.2),smin(sdSphere(p-vec3(.6,.2,0),.35),sdRBox(p-vec3(.08,.05,0),vec3(.75,.18,.3),.18),.2),.2);
   r=vec2(c,1.);r=U(r,vec2(sdBolt(rotZ(.12)*(p-vec3(.05,-.55,.15)),.55,.12),0.));}
  else if(v==5){r=vec2(sdBolt(rotZ(.25)*(p-vec3(-.28,0,0)),.8,.15),0.);r=U(r,vec2(sdBolt(rotZ(-.2)*(p-vec3(.35,.05,-.15)),.65,.13),1.));}
  else {r=vec2(sdCrown(p*1.15)/1.15,0.);r=U(r,vec2(sdGem(rotX(1.5708)*(p-vec3(0,-.02,.52))*4.)/4.,3.));}}
 else if(uScene==8){ // crimson blades fanned
  for(int i=0;i<5;i++){float fi=float(i);vec3 q=rotZ(.95-fi*.38)*(p-vec3(-.75,-.55,-fi*.12));
   r=U(r,vec2(sdRBox(q-vec3(1.15,0,0),vec3(1.15,.2,.07),.07),mod(fi,2.)==0.?1.:2.));}}
 else if(uScene==9){ // crown on a cushion
  r=vec2(sdRBox(p-vec3(0,-.62,0),vec3(.75,.12,.6),.12),1.);
  r=U(r,vec2(sdCrown((p-vec3(0,.05,0))*1.25)/1.25,0.));
  r=U(r,vec2(sdSphere(p-vec3(0,.32,.42),.08),3.));}
 else if(uScene==10){ // gems
  r=vec2(sdGem(p),1.);
  r=U(r,vec2(sdGem((p-vec3(1.15,-.55,.3))*2.4)/2.4,2.));
  r=U(r,vec2(sdGem((p-vec3(-1.05,-.6,.2))*3.)/3.,2.));}
 else if(uScene==11){ // lava blobs
  float d=sdSphere(p-vec3(0,-.1,0),.55);
  d=smin(d,sdSphere(p-vec3(.7,-.3,.2),.4),.35);d=smin(d,sdSphere(p-vec3(-.65,-.4,.1),.38),.35);
  d=smin(d,sdSphere(p-vec3(.25,.55,-.1),.3),.3);d=smin(d,sdSphere(p-vec3(-.3,.75,.1),.18),.3);
  r=vec2(d,1.);r=U(r,vec2(sdSphere(p-vec3(.95,.55,.2),.14),2.));r=U(r,vec2(sdSphere(p-vec3(-1.,.3,.3),.1),2.));}
 else if(uScene==12){ // tread plate: raised diamonds on a steel plate, a gem resting on it
  vec3 q=p; r=vec2(q.y+.02,1.);
  vec2 id=floor(q.xz/.5+.5); vec3 c=q; c.xz-=.5*id; float s=mod(id.x+id.y,2.)==0.?1.:-1.;
  vec2 d2=vec2(c.x*.7071+s*c.z*.7071,-s*c.x*.7071+c.z*.7071);
  r=U(r,vec2(sdCap(vec3(d2.x,c.y,d2.y),vec3(-.15,0,0),vec3(.15,0,0),.055),2.));
}
 else if(uScene==13){ // ice crystals
  for(int i=0;i<6;i++){float fi=float(i);float ang=-.9+fi*.36;float len=.9+.5*hash1(vec2(fi,2.));
   vec3 q=rotZ(ang)*(p-vec3(0,-.75,0));q.y-=len*.5;
   float d=sdHexP(q.xzy.xzy,.16,len*.5);
   d=max(sdHexP(vec3(q.x,q.y,q.z),.16,len*.5),dot(vec3(abs(q.x),q.y,abs(q.z)),normalize(vec3(1.,.55,1.)))-len*.3);
   r=U(r,vec2(d-.01,mod(fi,2.)==0.?1.:2.));}}
 else if(uScene==14){ // skyline
  vec3 q=p; float id=floor(q.x/.42+.5); q.x-=.42*id; float h=.5+1.1*hash1(vec2(id,4.)); float dep=hash1(vec2(id,9.))*.6;
  r=vec2(sdRBox(q-vec3(0,h-1.,dep),vec3(.17,h,.17),.03),7.);
  r=U(r,vec2(sdSphere(p-vec3(1.05,.95,-1.6),.42),0.));
  }
 else if(uScene==15){ // static: cubes field
  vec3 q=p; vec2 id=floor(q.xz/.24+.5); q.xz-=.24*id; float hh=hash1(id); float h=.03+.16*hh*hh;
  float m=hash1(id+5.)>.9?3.:(hash1(id+1.)>.5?1.:2.); r=vec2(sdRBox(q-vec3(0,h,0),vec3(.1,h,.1),.025),m);}
 else if(uScene==16){ // a stud (frames' corners)
  r=vec2(sdRCylZ(p,.7,.18,.12),1.);r=U(r,vec2(sdSphere(p-vec3(0,0,.12),.38),0.));}
 else if(uScene==17){ // a trophy (the kit's scene 1)
  r=vec2(sdRBox(p-vec3(0,-.95,0),vec3(.55,.14,.4),.06),1.);
  float g=sdRCyl(p-vec3(0,-.62,0),.12,.22,.04);g=min(g,sdRCyl(p-vec3(0,-.4,0),.3,.06,.03));
  float cup=smin(sdRCyl(p-vec3(0,.3,0),.6,.45,.08),sdSphere(p-vec3(0,0.,0),.6),.2);
  cup=max(cup,-sdRCyl(p-vec3(0,.55,0),.5,.45,.02));
  cup=min(cup,sdTorusZ(p-vec3(.62,.32,0),.22,.065));cup=min(cup,sdTorusZ(p-vec3(-.62,.32,0),.22,.065));
  r=U(r,vec2(min(g,cup),0.));r=U(r,vec2(sdStar(p-vec3(0,.28,.6),.2,.06),3.));}
 else if(uScene==18){ // a single gem facing the camera
  r=vec2(sdGem(rotX(1.2)*p),0.);}
 else if(uScene==19){ // a star
  r=vec2(sdStar(p,1.,.22),0.);}
 else if(uScene==20){ // a speech bubble, its tail bottom left
  float hw=uVar>0.?uVar:1.;r=vec2(sdRBox(p-vec3(0,.12,0),vec3(hw,.62,.2),.2),1.);
  vec3 q=rotZ(.5)*(p-vec3(-hw+.45,-.62,0)); r=vec2(smin(r.x,sdRBox(q,vec3(.12,.28,.16),.1),.12),1.);}
 else if(uScene==21){ // a key cap
  float hw=uVar>0.?uVar:1.;r=vec2(sdRBox(p-vec3(0,0,-.1),vec3(hw,.8,.22),.2),1.);
  r=U(r,vec2(sdRBox(p-vec3(0,.02,.12),vec3(hw-.14,.66,.12),.16),0.));}
 else if(uScene==22){ // a sign board: a dark slab in a coloured frame
  float hw=uVar>0.?uVar:1.;r=vec2(sdRBox(p,vec3(hw+.08,.82,.12),.1),0.);
  float fr=max(sdRBox(p-vec3(0,0,.08),vec3(hw,.74,.08),.06),-sdRBox(p-vec3(0,0,.08),vec3(hw-.12,.62,.3),.04));
  r=U(r,vec2(fr,1.));}
 else if(uScene==23){ // a podium drum
  r=vec2(sdRCyl(p-vec3(0,-.55,0),1.05,.22,.08),1.);
  r=U(r,vec2(sdRCyl(p-vec3(0,-.1,0),.85,.25,.08),0.));
  r=U(r,vec2(sdRCyl(p-vec3(0,.2,0),.9,.06,.04),2.));}
 return r;}
vec2 map(vec3 p){mat3 m=rotX(uPitch)*rotY(uYaw);vec2 r=scene(m*p);
 // Repeated fields (domain repetition with varying heights) take shorter steps, so no cell is overshot.
 if(uScene==1||uScene==2||uScene==3||uScene==5||uScene==12||uScene==14||uScene==15)r.x*=.55;return r;}
vec3 nrm(vec3 p){vec2 e=vec2(.0015,-.0015);return normalize(e.xyy*map(p+e.xyy).x+e.yyx*map(p+e.yyx).x+e.yxy*map(p+e.yxy).x+e.xxx*map(p+e.xxx).x);}
float shadow(vec3 ro,vec3 rd){float res=1.,t=.02;for(int i=0;i<40;i++){float h=map(ro+rd*t).x;res=min(res,9.*h/t);t+=clamp(h,.02,.25);if(res<.002||t>6.)break;}return clamp(res,0.,1.);}
float ao(vec3 p,vec3 n){float o=0.,s=1.;for(int i=1;i<6;i++){float h=.04*float(i)*1.6;o+=(h-map(p+n*h).x)*s;s*=.7;}return clamp(1.-1.6*o,0.,1.);}
vec3 lin(vec3 c){return pow(c,vec3(2.2));}
vec3 baseCol(float m,vec3 p){int i=int(m+.5);vec3 c=uCol[i];
 if(i==7){vec3 o=rotX(uPitch)*rotY(uYaw)*p;vec2 g=vec2(o.x*8.,o.y*6.5);vec2 f=fract(g);float win=step(.22,f.x)*step(f.x,.78)*step(.25,f.y)*step(f.y,.8);
  float on=hash1(floor(g))>.35?1.:0.;c=mix(uCol[1],mix(uCol[2],uCol[3],step(.75,hash1(floor(g)+3.))),win*on);}
 return lin(c);}

vec4 shade(vec2 frag){
 vec2 uv=(2.*frag-uRes)/uRes.y;
 vec3 ta=vec3(0,uLookY,0),ro=ta+vec3(0,.55,4.6)/uZoom;
 vec3 ww=normalize(ta-ro),uu=normalize(cross(ww,vec3(0,1,0))),vv=cross(uu,ww);
 vec3 rd=normalize(uv.x*uu+uv.y*vv+2.6*ww);
 vec3 L=normalize(vec3(-.55,.85,.6));
 float t=0.,minD=1e9,tm=0.;vec2 h;bool hit=false;
 for(int i=0;i<220;i++){h=map(ro+rd*t);if(h.x<minD){minD=h.x;tm=t;}if(h.x<.0008*t){hit=true;break;}t+=h.x*.9;if(t>12.)break;}
 if(!hit){
  if(uStyle==2&&minD<.022*(tm*.3))return vec4(lin(vec3(.11,.09,.08)),1.);
  float tp=(uGround-ro.y)/rd.y;
  if(tp>0.){vec3 p=ro+rd*tp;float s=shadow(p,L);
   float a;if(uStyle==2)a=(s<.5?.38:0.);else a=(1.-s)*.42;
   float occ=0.;for(int k=0;k<3;k++){occ+=max(0.,.25-map(p+vec3(0,.12*float(k+1),0)).x);} if(uStyle!=2)a=max(a,clamp(occ*.9,0.,.45));
   return vec4(vec3(0.),a);}
  return vec4(0.);}
 vec3 p=ro+rd*t,n=nrm(p);vec3 b=baseCol(h.y,p);
 float dif=clamp(dot(n,L),0.,1.),sh=shadow(p+n*.004,L),oc=ao(p,n);
 vec3 H=normalize(L-rd);float sp=clamp(dot(n,H),0.,1.);float fr=pow(1.-clamp(dot(n,-rd),0.,1.),3.);
 vec3 c;
 if(uStyle==0){float wrap=clamp((dot(n,L)+.4)/1.4,0.,1.);
  c=b*(.30*oc*(.65+.35*n.y)+.95*wrap*mix(.5,1.,sh))+.05*pow(sp,12.)*sh+.06*fr*oc*b;}
 else if(uStyle==1){vec3 rr=reflect(rd,n);
  c=b*(.24*oc*(.6+.4*n.y)+.95*dif*mix(.35,1.,sh))+vec3(1.)*.95*pow(sp,80.)*sh+.22*fr*oc+.10*smoothstep(.1,.9,rr.y)*oc;}
 else {float q=dif*sh;float s=q>.5?1.:(q>.12?.74:.54);c=b*s*(.86+.14*oc);
  if(pow(sp,40.)>.85)c=mix(c,vec3(1.),.6);
  if(dot(n,-rd)<.26)c=lin(vec3(.11,.09,.08));}
 c=c/(1.+.15*c);c=pow(c,vec3(1./2.2));return vec4(c,1.);}

void main(){vec4 acc=vec4(0.);
 for(int i=0;i<2;i++)for(int j=0;j<2;j++){vec4 s=shade(gl_FragCoord.xy+vec2(float(i),float(j))*.5-.25);acc+=vec4(s.rgb*s.a,s.a);}
 acc/=4.;o=acc;}
</script>
<script>
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{preserveDrawingBuffer:true,premultipliedAlpha:true,alpha:true});
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x;}
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,'#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0,1);}'));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent.trim()));
gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(pr));
gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const u=n=>gl.getUniformLocation(pr,n);
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
window.renderArt=({scene,style,cols,w,h,yaw=0,pitch=0,zoom=1,ground=-1.1,lookY=0,ball=[1.0,-.12,.42],variant=0})=>{
 cv.width=w;cv.height=h;gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
 gl.uniform2f(u('uRes'),w,h);gl.uniform1i(u('uScene'),scene);gl.uniform1i(u('uStyle'),style);
 const c=[];for(let i=0;i<8;i++)c.push(...hex(cols[i]||'#808080'));gl.uniform3fv(u('uCol'),new Float32Array(c));
 gl.uniform1f(u('uYaw'),yaw);gl.uniform1f(u('uPitch'),pitch);gl.uniform1f(u('uZoom'),zoom);gl.uniform1f(u('uGround'),ground);gl.uniform1f(u('uLookY'),lookY);gl.uniform1f(u('uVar'),variant);
 gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();return cv.toDataURL('image/png');};
window.ready=true;
</script>
