.grp { overflow:hidden; } .r { display:flex; align-items:center; gap:12px; min-height:54px; padding:0 14px; font:700 15.5px/1.2 Archivo; } .r + .r { box-shadow:inset 0 1px 0 var(--line); } .r small { display:block; font:600 12px/1.2 Archivo; color:var(--text3); margin-top:3px; }

.chev { color:var(--text3); font:800 18px/1 Archivo; }
