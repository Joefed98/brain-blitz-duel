# Fast checks on every push to a PR: every check that starts no browser (the scoring, replay, standard,
# type-level and unit-style checks), split into shards a-g (.github/ci/shards.ts). The checks that start Chromium
# run in full-suite.yml only, once a PR is labelled `ready-to-merge` (CI cost cut, 1 Nov 2026; which side a check
# is on is worked out from its source, .github/ci/browser.ts, and proved by ci-shards-check).
# Pull requests run the slow checks at quick depth (snip-check's sampled search, puzzle-bank-check's 2-entry
# rebuild sample); Actions → Checks → Run workflow with "full" ticked runs them at full depth (CHECKS_FULL=1).
name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Docs, screenshots and notes skip CI, except the docs a check reads (docs/beta-sql.md: challenge-check and
    # daily-check; docs/sound-cues/: the sound and polish checks).
    paths:
      - "**"
      - "!docs/**"
      - "!screenshots/**"
      - "!**/*.md"
      - "!.lovable/**"
      - "docs/beta-sql.md"
      - "docs/sound-cues/**"
  workflow_dispatch:
    inputs:
      full:
        description: >-
          Full depth: snip-check's full template search and puzzle-bank-check's
          8-entry rebuild sample (about 6 extra minutes on the d shard)
        type: boolean
        default: true

# One run per PR: a new push cancels the run in progress. Pull requests only (never also on push), so a commit
# is never checked twice.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The repo doesn't pin Bun; this matches the version Claude Code cloud sessions use.
  BUN_VERSION: "1.4.2"

jobs:
  checks:
    name: checks (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Keys must be the fast shards of .github/ci/shards.ts (ci-shards-check compares them).
        shard: [a, b, c, d, e, f, g]
    env:
      CHECKS_FULL: ${{ inputs.full && '1' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      # bun.lock pins some packages to Lovable's private npm cache (403 outside
      # Lovable). Point them at the public registry for the install only (same
      # versions and integrity hashes), then restore the lockfile exactly.
      - name: Install dependencies
        run: |
          cp bun.lock "$RUNNER_TEMP/bun.lock.orig"
          sed -i -E 's#https://europe-west[0-9]+-npm\.pkg\.dev/lovable-core-prod/[^/]+/#https://registry.npmjs.org/#g' bun.lock
          bun install --frozen-lockfile
          cp "$RUNNER_TEMP/bun.lock.orig" bun.lock
          git diff --exit-code -- bun.lock

      # The runner's memory and cores, for the dev-server memory work (4 Nov 2026).
      - name: Runner memory
        run: |
          free -m
          nproc
          echo "> runner: $(free -m | awk '/^Mem:/{print $2}') MB RAM, $(nproc) cores." >> "$GITHUB_STEP_SUMMARY"

      - name: Run checks (${{ matrix.shard }})
        run: bun .github/ci/run-shard.ts ${{ matrix.shard }} 2>&1 | tee ci-results-${{ matrix.shard }}.log
        shell: bash # -eo pipefail: a failing runner fails the step through tee

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: check-logs-${{ matrix.shard }}
          path: |
            ci-results/
            ci-results-${{ matrix.shard }}.log
          retention-days: 7
