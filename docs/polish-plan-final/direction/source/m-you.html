<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
.pc { padding:0; overflow:hidden; } .pc .band { height:84px; background: radial-gradient(60% 120% at 20% 0%, #2EF0C8 0%, transparent 60%), radial-gradient(60% 120% at 70% 10%, #B26BFF 0%, transparent 62%), linear-gradient(180deg,#14306A,#0B1226); }
.pc .in { padding:0 16px 14px; margin-top:-40px; text-align:center; } .pc .av { width:92px; height:92px; border-radius:22px; margin:0 auto; box-shadow:0 0 0 3px var(--gold); } .pc .nm { font:900 24px/1 Archivo; margin-top:10px; }
.shelf { display:flex; align-items:center; gap:10px; padding:10px 14px; } .shelf img { height:40px; } .shelf .more { margin-left:auto; color:var(--text3); font:700 13px/1 Archivo; }
.rings { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; } .rg { padding:12px 6px 10px; text-align:center; } .ring { width:68px; height:68px; border-radius:50%; margin:0 auto; background:conic-gradient(var(--k) var(--v), #1C2A52 0); display:flex; align-items:center; justify-content:center; } .ring b { width:54px; height:54px; border-radius:50%; background:var(--surface); display:flex; align-items:center; justify-content:center; font:900 16px/1 Archivo; font-variant-numeric:tabular-nums; } .rg small { display:block; margin-top:8px; font:700 11px/1.15 Archivo; color:var(--text2); }
.cat { display:grid; grid-template-columns:70px 1fr 48px; gap:10px; align-items:center; font:700 13.5px/1 Archivo; height:30px; } .cat i { display:block; height:8px; border-radius:4px; background:var(--k); } .cat b { text-align:right; font:800 14px/1 Archivo; font-variant-numeric:tabular-nums; }
.rows4 { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; } .rows4 div { height:62px; border-radius:12px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; font:700 11.5px/1 Archivo; color:var(--text2); } .rows4 img { width:24px; height:24px; }
</style></head><body><div class="page">
  <div class="row"><h1 class="grow">You</h1><div class="btn sec sm">Settings</div></div>
  <div class="cut pc mt14"><div class="band"></div><div class="in"><div class="av"><img src="art/avatars/svg/captain-joulz.svg"></div><div class="nm">TheInventor</div><div class="row g8 mt10" style="justify-content:center"><span class="pill gold">Volt II · 1,278</span><span class="cap" style="font-size:9.5px">Founding #0042</span><span class="btn sec sm" style="height:26px;font-size:12px;padding:0 10px">Customise</span></div></div></div>
  <div class="panel shelf mt10"><img src="art/svg/trophy-gold.svg"><img src="art/svg/trophy-silver.svg"><img src="art/svg/medal-gold.svg"><img src="art/svg/medal-bronze.svg"><img src="art/svg/emblem-volt.svg"><span class="more">Trophies 5 ›</span></div>
  <div class="rings mt10">
    <div class="panel rg"><div class="ring" style="--k:var(--win);--v:58%"><b>58%</b></div><small>Rated wins<br>41 of 71</small></div>
    <div class="panel rg"><div class="ring" style="--k:var(--gold);--v:15%"><b>37</b></div><small>Stars<br>of 249</small></div>
    <div class="panel rg"><div class="ring" style="--k:#FF8A3D;--v:57%"><b>4</b></div><small>Daily streak<br>best 7</small></div>
  </div>
  <div class="row mt18"><div class="cap grow">Strongest categories</div><span class="sub" style="font-size:13px">All ratings ›</span></div>
  <div class="panel mt10" style="padding:8px 14px"><div class="cat" style="--k:var(--pattern)">Pattern<i style="width:92%"></i><b>1,350</b></div><div class="cat" style="--k:var(--word)">Word<i style="width:84%"></i><b>1,312</b></div><div class="cat" style="--k:var(--retro)">Retro<i style="width:66%"></i><b>1,176</b></div></div>
  <div class="rows4 mt10"><div><img src="pub/nav/friends-3x.webp">Friends</div><div><img src="pub/nav/challenges-3x.webp">Challenges</div><div><img src="pub/nav/trophyHero-2x.webp">Badges</div><div><img src="pub/nav/support-3x.webp">Help</div></div>
  <div class="tabs"><div class="tab"><img src="pub/nav/home-3x.webp">Home</div><div class="tab"><img src="pub/nav/games-3x.webp">Games</div><div class="tab"><img src="pub/nav/tournaments-3x.webp">Compete</div><div class="tab"><img src="pub/nav/shop-3x.webp">Shop</div><div class="tab on"><img src="pub/nav/profile-3x.webp">You</div></div>
</div></body></html>
