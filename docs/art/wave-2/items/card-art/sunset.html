<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=Silkscreen:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#06080F}
a{color:#22E4FF}a:hover{color:#7FF0FF}
.cut{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.cutsm{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
/* VSANIM */
.a-top{animation:jzInR .55s cubic-bezier(.2,.8,.2,1) both}
.a-bot{animation:jzInL .55s .08s cubic-bezier(.2,.8,.2,1) both}
.a-rail{transform-origin:50% 50%;animation:jzRail .4s .45s cubic-bezier(.2,.8,.2,1) both}
.a-vs{animation:jzSlam .45s .75s cubic-bezier(.2,1.4,.4,1) both}
.a-fade1{animation:jzFade .3s .9s ease-out both}.a-fade2{animation:jzFade .3s 1.05s ease-out both}.a-fade3{animation:jzFade .3s 1.2s ease-out both}
@keyframes jzInR{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
@keyframes jzInL{from{transform:translateX(-120%);opacity:0}to{transform:none;opacity:1}}
@keyframes jzRail{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes jzSlam{0%{transform:scale(2.4);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes jzFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a-top,.a-bot,.a-rail,.a-vs,.a-fade1,.a-fade2,.a-fade3{animation:none}}
.stripes{background-image:repeating-linear-gradient(-55deg,rgba(238,242,255,0.035) 0 2px,transparent 2px 10px)}
.lg-run{stroke-dasharray:16 520;animation:lgRun 3.2s linear infinite}
.lg-run2{animation-delay:-1.1s}.lg-run3{animation-delay:-2.2s}
@keyframes lgRun{from{stroke-dashoffset:536}to{stroke-dashoffset:0}}
.lg-glow{animation:lgGlow 2.4s ease-in-out infinite}
@keyframes lgGlow{0%,100%{opacity:.8}50%{opacity:1}}
.lg-sweep{animation:lgSweep 4.5s ease-in-out infinite}
@keyframes lgSweep{0%{transform:translateX(-180px)}55%,100%{transform:translateX(440px)}}
.lg-tw{animation:lgTw 2.6s ease-in-out infinite}.lg-tw2{animation-delay:-.9s}.lg-tw3{animation-delay:-1.7s}
@keyframes lgTw{0%,100%{opacity:.25}50%{opacity:1}}
.lg-drift{animation:lgDrift 7s ease-in-out infinite alternate}.lg-drift2{animation-delay:-2.5s}.lg-drift3{animation-delay:-5s}
@keyframes lgDrift{from{transform:translateX(-14px)}to{transform:translateX(14px)}}
@media (prefers-reduced-motion: reduce){.lg-run,.lg-glow,.lg-sweep,.lg-tw,.lg-drift{animation:none}.lg-run{stroke-dasharray:none;opacity:0}}
.lg-frame{stroke-dasharray:36 780;animation:lgFrame 4.5s linear infinite}
@keyframes lgFrame{from{stroke-dashoffset:816}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.lg-frame{animation:none;opacity:0}}
.lg-iri{animation:lgIri 8s linear infinite}
@keyframes lgIri{to{filter:hue-rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.lg-iri{animation:none}}
.nc-prism{animation:ncFlow 3.5s linear infinite}
.nc-flux{animation:ncFlow 5s linear infinite,ncPulse 2.4s ease-in-out infinite}
@keyframes ncFlow{to{background-position:200% 0}}
@keyframes ncPulse{0%,100%{opacity:.88}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.nc-prism,.nc-flux{animation:none}}
.nc-flux{animation:ncFlicker 3s linear infinite}
@keyframes ncFlicker{0%,100%{text-shadow:0 0 2px #FFF,0 0 8px #22E4FF,0 0 16px #FF3DCB,0 1px 2px #000}8%{text-shadow:0 0 2px #FFF,0 0 4px #22E4FF,0 0 6px #FF3DCB,0 1px 2px #000;opacity:.85}10%{text-shadow:0 0 3px #FFF,0 0 12px #22E4FF,0 0 22px #FF3DCB,0 1px 2px #000;opacity:1}46%{text-shadow:0 0 2px #FFF,0 0 10px #FF3DCB,0 0 18px #22E4FF,0 1px 2px #000}54%{opacity:.9}56%{opacity:1}}
@media (prefers-reduced-motion: reduce){.nc-flux{animation:none}}
.lg-zap{animation:lgZap 1.7s steps(1) infinite}.lg-zap2{animation-delay:-.6s}.lg-zap3{animation-delay:-1.1s}
@keyframes lgZap{0%{opacity:0}12%{opacity:1}18%{opacity:0}46%{opacity:1}50%{opacity:0}78%{opacity:.8}84%{opacity:0}100%{opacity:0}}
.lg-sway{transform-box:view-box;transform-origin:150px -8px;animation:lgSway 4s ease-in-out infinite alternate}
@keyframes lgSway{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@media (prefers-reduced-motion: reduce){.lg-zap{animation:none;opacity:0}.lg-sway{animation:none}}
.nc-sheen{animation:ncSheen 4.2s linear infinite}
@keyframes ncSheen{0%{transform:translateX(-110px)}55%,100%{transform:translateX(410px)}}
.nc-node{animation:ncNode 4.2s linear infinite}
@keyframes ncNode{0%,14%,100%{fill:#06080F;stroke:#FF3DCB}4%{fill:#FFE3F6;stroke:#FFFFFF}}
@media (prefers-reduced-motion: reduce){.nc-sheen{animation:none;opacity:0}.nc-node{animation:none}}
