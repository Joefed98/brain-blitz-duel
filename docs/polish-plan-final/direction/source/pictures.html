<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
body { background: var(--bg); } .board { width: 1440px; padding: 34px 40px 36px; }
.t1 { font: 900 42px/1 "Archivo"; font-stretch: 112%; } .t5 { font: 600 15px/1.35 "Archivo"; color: var(--text2); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 20px; }
.g { padding: 14px 16px 16px; border-radius: 16px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
.g .hd { display: flex; align-items: center; gap: 12px; } .g .tile { width: 46px; border-radius: 10px; flex: none; } .g .nm { font: 800 19px/1 "Archivo"; } .g .lev { font: 700 13px/1 "Archivo"; color: var(--gold); margin-top: 5px; }
.four { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.c { border-radius: 10px; padding: 8px; background: color-mix(in srgb, var(--lc) 9%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--lc) 40%, var(--line)); }
.c .top { display: flex; align-items: center; gap: 6px; font: 800 11px/1 "Archivo"; letter-spacing: .07em; text-transform: uppercase; }
.pic { height: 138px; margin-top: 8px; border-radius: 8px; position: relative; overflow: hidden; background: #050818; }
.c p { font: 800 13px/1.2 "Archivo"; margin-top: 8px; min-height: 31px; }
.pic i, .pic b, .pic span { position: absolute; display: block; }
</style></head><body><div class="board">
<div class="row"><div class="grow"><div class="cap" style="color:var(--gold)">Joulz · difficulty · the first three seconds</div><div class="t1 mt10">You can see the step before you play</div></div><div class="t5" style="max-width:440px;text-align:right">Eight ladders drawn from their level settings. Each picture is what the screen shows as the round opens. These are the small pictures the ladder on a game's page uses.</div></div>
<div class="grid" id="out"></div></div>
<script>
const W = 150, H = 150, L = ["Easy","Normal","Hard","Expert"];
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const cols = ["#FF4D6A","#FF8A3D","#FFC81E","#3DDC84","#36E2F5","#4D8CFF","#B26BFF","#FF6BD6","#FF4D6A","#FF8A3D","#FFC81E","#3DDC84"];
const G = [
 ["breaker","Breaker","Rows of bricks in the wall","retro",["6 rows, wide paddle","9 rows","11 rows, 2 sliding","12 rows, 4 sliding"], (k) => { const rows=[6,9,11,12][k], pw=[62,46,29,20][k], sl=[[],[],[8,10],[6,8,9,11]][k]; let h=""; for(let r=0;r<rows;r++) for(let c=0;c<9;c++) h+=`<i style="left:${7+c*15+(sl.includes(r)?(r%2?5:-5):0)}px;top:${8+r*8}px;width:13px;height:6px;border-radius:1px;background:${cols[r]}"></i>`; return h+`<i style="left:${(W-pw)/2}px;bottom:10px;width:${pw}px;height:5px;border-radius:3px;background:var(--gold)"></i><i style="left:84px;bottom:34px;width:5px;height:5px;background:#fff"></i>`; }, "#050818"],
 ["sudoku","Box Six","Numbers given at the start","logic",["25 of 36 given","14 given","10 given","8 given, a Check button"], (k) => { const n=[25,14,10,8][k]; const cells=[...Array(36).keys()].sort(()=>rnd()-.5).slice(0,n); let h=""; for(let i=0;i<36;i++){ const x=i%6,y=(i/6|0),g=cells.includes(i); h+=`<i style="left:${14+x*21+(x>2?3:0)}px;top:${10+y*21+(y>1?3:0)+(y>3?3:0)}px;width:19px;height:19px;border-radius:4px;background:${g?"#E9FBF7":"#12313D"};font:800 12px/19px Archivo;color:#06242C;text-align:center;font-style:normal">${g?1+(i*7+k)%6:""}</i>`;} return h; }, "#0B1F2A"],
 ["numhunt","Ascend","Numbers on the board","speed",["16 big discs, never moving","24 discs","32 discs, a short clock","40 discs, highest first"], (k) => { const n=[16,24,32,40][k], r=[15,12,10.5,9.5][k]; const cs=Math.ceil(Math.sqrt(n*W/H)), rs=Math.ceil(n/cs); let h=""; for(let i=0;i<n;i++){ const x=(i%cs+.5)*(W/cs)+(rnd()-.5)*6, y=((i/cs|0)+.5)*(H/rs)+(rnd()-.5)*6; h+=`<i style="left:${x-r}px;top:${y-r}px;width:${2*r}px;height:${2*r}px;border-radius:50%;background:#F4ECD8;box-shadow:0 2px 0 #B9A77E;font:800 ${r*.9}px/${2*r}px Archivo;color:#3A2A12;text-align:center;font-style:normal">${k?10+((i*37)%90):i+1}</i>`;} return h; }, "#7A3A14"],
 ["snake","Meteor","Rocks on the field","retro",["An open field, no rocks","Rocks fall later","8 rocks down, walls","16 rocks, walls, 1 life"], (k) => { const n=[0,0,8,16][k]; let h=k>1?`<i style="inset:3px;border:2px solid #36E2F5;border-radius:3px"></i>`:""; for(let i=0;i<n;i++){ const s=8+(i%3)*4; h+=`<i style="left:${10+rnd()*(W-30)}px;top:${10+rnd()*(H-30)}px;width:${s}px;height:${s}px;background:#8A8FA8;border-radius:2px"></i>`;} for(let i=0;i<6;i++) h+=`<i style="left:${60+i*7}px;top:${96-i*2}px;width:6px;height:6px;border-radius:50%;background:${i==5?"#FFF3C4":"#FFB43A"};opacity:${.35+i*.13}"></i>`; h+=`<i style="left:112px;top:40px;width:7px;height:7px;background:#FFE14A;clip-path:polygon(50% 0,62% 35%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 35%)"></i>`; return h+`<b style="right:6px;top:5px;font:800 9px/1 Archivo;color:#FF6B7E;letter-spacing:.05em">${["♥♥♥","♥♥","♥♥","♥"][k]}</b>`; }, "#050818"],
 ["freekick","Top Bins","Players in the wall","sports",["2 in the wall, no wind","3 to 5, a light wind","5 or 6, a stiff wind","7 in the wall, wind 8"], (k) => { const n=[2,4,6,7][k], wind=[0,2,5,8][k]; let h=`<i style="left:25px;top:22px;width:104px;height:44px;border:3px solid #fff;border-bottom:0"></i><i style="left:0;right:0;top:66px;bottom:0;background:#1E7A2A"></i><i style="left:0;right:0;top:66px;height:2px;background:rgba(255,255,255,.5)"></i>`; for(let i=0;i<n;i++) h+=`<i style="left:${77-n*6.5+i*13}px;top:78px;width:11px;height:26px;border-radius:5px 5px 2px 2px;background:#E23B3B"></i><i style="left:${79.5-n*6.5+i*13}px;top:70px;width:8px;height:8px;border-radius:50%;background:#F2C9A0"></i>`; h+=`<i style="left:73px;bottom:10px;width:9px;height:9px;border-radius:50%;background:#fff"></i>`; return h+`<b style="left:6px;top:5px;font:800 9px/1 Archivo;color:#fff;letter-spacing:.05em">WIND ${wind}</b>`; }, "#0E3A1A"],
 ["bastion","Iron Wall","Tanks in each wave","action",["4 tanks, 3 lanes","6 tanks, 3 lanes","A 4th lane, 8 tanks","4 lanes, 9 tanks, faster"], (k) => { const lanes=[3,3,4,4][k], n=[4,6,8,9][k]; let h=`<i style="left:0;right:0;top:0;height:30px;background:#C9A26A"></i>`; for(let l=0;l<=lanes;l++) h+=`<i style="left:${20+l*(110/lanes)}px;top:30px;bottom:0;width:2px;background:rgba(255,255,255,.25)"></i>`; for(let i=0;i<n;i++){ const l=i%lanes, s=9+(i/lanes|0)*4; h+=`<i style="left:${20+(l+.5)*(110/lanes)-s/2}px;top:${40+(i/lanes|0)*28+rnd()*6}px;width:${s}px;height:${s*.8}px;border-radius:2px;background:#5B6B3A;box-shadow:0 0 0 1px #2A3318"></i>`;} return h; }, "#8A6A3A"],
 ["beat","Tempo","Number of lanes","retro",["3 wide lanes","4 lanes","5 lanes from the start","6 narrow lanes, fast"], (k) => { const n=[3,4,5,6][k], lc=["#36E2F5","#FF4FD8","#FFC81E","#3DDC84","#B26BFF","#FF8A3D"]; let h=""; for(let l=0;l<n;l++){ const w=(W-12)/n; h+=`<i style="left:${10+l*w}px;top:0;bottom:22px;width:${w-3}px;background:rgba(255,255,255,.04)"></i><i style="left:${10+l*w}px;bottom:6px;width:${w-3}px;height:13px;border-radius:3px;background:${lc[l]};opacity:.9"></i>`; const notes=[1,2,2,3][k]; for(let j=0;j<notes;j++) h+=`<i style="left:${10+l*w+2}px;top:${12+((l*37+j*53+k*11)%95)}px;width:${w-7}px;height:8px;border-radius:2px;background:${lc[l]}"></i>`;} return h; }, "#07061C"],
 ["mahjong","Mahjong Solitaire","Tiles in the stack","cards",["48 big tiles, 2 layers","72 tiles, 4 layers","104 smaller tiles","136 tiles, wall to wall"], (k) => { const [cx,cy,ly]=[[6,7,2],[6,7,4],[7,8,4],[8,9,4]][k]; const tw=Math.min(18,(W-16)/cx), th=tw*1.25; let h=""; for(let z=0;z<ly;z++){ const ins=z*.75; for(let y=ins;y<cy-ins-.01;y++) for(let x=ins;x<cx-ins-.01;x++) h+=`<i style="left:${(W-cx*tw)/2+x*tw-z*1.5+3}px;top:${(H-cy*th)/2+y*th-z*2}px;width:${tw-1}px;height:${th-1}px;border-radius:2px;background:${z==ly-1||x<ins+1||y<ins+1?"#F7EFDC":"#EADFC4"};box-shadow:1px 1.5px 0 #9C8A62"></i>`;} return h; }, "#0E4A3A"],
];
document.getElementById("out").innerHTML = G.map(([id,nm,lev,fam,caps,draw,bg]) => `<div class="g"><div class="hd"><div class="tile" style="--c:var(--${fam})"><img src="pub/tiles/${id}.webp"></div><div><div class="nm">${nm}</div><div class="lev">${lev}</div></div></div><div class="four">` + [0,1,2,3].map((k) => { seed = 11 + k * 3 + id.length; return `<div class="c l${k+1}"><div class="top"><span class="lvl l${k+1}"><i></i><i></i><i></i><i></i></span>${L[k]}</div><div class="pic" style="background:${bg}"><div style="position:absolute;left:0;top:0;width:150px;height:150px;transform:scale(.92);transform-origin:0 0">${draw(k)}</div></div><p>${caps[k]}</p></div>`; }).join("") + `</div></div>`).join("");
</script></body></html>
