<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="game.css"><script>document.documentElement.dataset.dir = new URLSearchParams(location.search).get("dir") || "a";</script>
<style>
.seg { display:flex; gap:6px; background: var(--chip); border-radius:18px; padding:5px; margin: 4px 0 14px; }
.seg div { flex:1; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; font: 900 16px "Archivo"; color: var(--text2); }
.seg div.on { background:#fff; color: var(--ink); box-shadow: 0 4px 0 var(--white-ledge); }

.bundle h1 { font-size:30px; color:#fff; text-shadow:0 3px 0 rgba(90,10,40,.5); margin-top:8px; }

.bundle .im { position:absolute; right:10px; top:14px; width:150px; height:150px; }
.bundle .im img { position:absolute; width:104px; border-radius:14px; border:4px solid #fff; box-shadow:0 5px 0 rgba(0,0,0,.3); }
.price { display:inline-flex; align-items:center; gap:8px; }
.items { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.it { height: 208px; padding:10px; display:flex; flex-direction:column; align-items:center; }
.it .still { width:100%; height:104px; border-radius:14px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.it .still img { width:100%; height:100%; object-fit:cover; }
.it b { font: 900 17px "Archivo"; margin-top:8px; }
.it .r { font-size:12.5px; font-weight:800; }
.it .btn { margin-top:auto; width:100%; }
.heart { position:absolute; right:14px; top:14px; width:32px; height:32px; border-radius:50%; background: rgba(10,10,60,.55); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; }
