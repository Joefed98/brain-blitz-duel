<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<script>document.documentElement.dataset.dir = new URLSearchParams(location.search).get("dir") || "a";</script>
<style>
body { background: linear-gradient(180deg, #2ED3B7 0%, #138E86 30%, var(--bg1) 74%); }
.art { height: 300px; position:relative; display:flex; align-items:center; justify-content:center; }
.art .tile { width: 232px; height: 232px; border: 6px solid #fff; border-radius: 34px; box-shadow: 0 10px 0 rgba(0,70,60,.55), 0 26px 40px rgba(0,0,0,.35); transform: rotate(-3deg); }
.back { position:absolute; left:16px; top:16px; width:46px; height:46px; border-radius:15px; background:#fff; color:#0E3F5A; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 0 rgba(0,0,0,.25); font: 900 22px "Archivo"; }
.best { position:absolute; right:16px; top:20px; z-index:2; }
.body { padding: 0 18px; }
.lv { display:grid; grid-template-columns: repeat(4,1fr); gap:8px; margin: 18px 0 16px; }
.lv div { height: 74px; border-radius:18px; background: var(--card); box-shadow: 0 5px 0 var(--ledge); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font: 900 15px "Archivo"; color: var(--text2); }
.lv div i { width:22px; height:22px; }
.lv div.on { color:#fff; transform: translateY(-4px); }
.goal { font: 800 18px/1.3 "Archivo"; color: var(--text); margin: 4px 2px 18px; }
.how { display:flex; gap:10px; margin-top:22px; }
.how div { flex:1; height:52px; border-radius:16px; background: var(--chip); display:flex; align-items:center; justify-content:center; gap:8px; font-weight:800; font-size:15px; color: var(--text2); }
</style></head><body><div class="page">
  <div class="art"><div class="rays" style="opacity:.2"></div><div class="back">‹</div><span class="pill dark best"><i class="star"></i> Best 148</span>
    <div class="tile"><img src="pub/tiles/tubes.webp"></div></div>
  <div class="body">
    <div class="row gap10"><h1 style="font-size:36px" class="grow">Polypotions</h1><span class="pill" style="background:var(--logic);color:#06342E">Logic</span></div>
    <div class="goal" style="margin-top:8px">Sort every flask to one colour.</div>
    <div class="lv">
      <div><i class="star"></i>Easy</div>
      <div class="on" style="background:var(--normal);box-shadow:0 5px 0 #2D5FC4"><i class="star off"></i>Normal</div>
      <div><i class="star off"></i>Hard</div>
      <div><i class="star off"></i>Expert</div>
    </div>
    <div class="btn big full">Play</div>
    <div class="how"><div>How to play</div><div>Challenges 1 / 3</div></div>
  </div>
</div></body></html>
