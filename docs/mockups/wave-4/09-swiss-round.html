<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Joulz – Swiss round</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#06080F}
a{color:#22E4FF}a:hover{color:#7FF0FF}
.cut{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.cutsm{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
/* VSANIM */
.a-top{animation:jzInR .55s cubic-bezier(.2,.8,.2,1) both}
.a-bot{animation:jzInL .55s .08s cubic-bezier(.2,.8,.2,1) both}
.a-rail{transform-origin:50% 50%;animation:jzRail .4s .45s cubic-bezier(.2,.8,.2,1) both}
.a-vs{animation:jzSlam .45s .75s cubic-bezier(.2,1.4,.4,1) both}
.a-fade1{animation:jzFade .3s .9s ease-out both}.a-fade2{animation:jzFade .3s 1.05s ease-out both}.a-fade3{animation:jzFade .3s 1.2s ease-out both}
@keyframes jzInR{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
@keyframes jzInL{from{transform:translateX(-120%);opacity:0}to{transform:none;opacity:1}}
@keyframes jzRail{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes jzSlam{0%{transform:scale(2.4);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes jzFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.a-top,.a-bot,.a-rail,.a-vs,.a-fade1,.a-fade2,.a-fade3{animation:none}}
.stripes{background-image:repeating-linear-gradient(-55deg,rgba(238,242,255,0.035) 0 2px,transparent 2px 10px)}
</style>
</head>
