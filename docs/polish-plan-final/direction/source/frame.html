<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
.page { padding: 0; }
.shot { position: absolute; left: 0; top: 2px; width: 390px; }
.hd { position: absolute; left: 0; right: 0; top: 0; height: 60px; padding: 0 12px; display: flex; align-items: center; gap: 10px; background: #070B18; box-shadow: inset 0 -1px 0 var(--surface2); z-index: 2; }
.hd .nm { font: 800 17px/1 "Archivo"; } .hd .sc { text-align: right; } .hd .sc b { display: block; font: 900 22px/1 "Archivo"; font-variant-numeric: tabular-nums; } .hd .sc small { font: 700 10px/1 "Archivo"; letter-spacing: .1em; color: var(--text3); }
.bar { position: absolute; left: 0; right: 0; top: 60px; height: 5px; background: #0E1630; z-index: 2; } .bar i { display: block; height: 100%; width: 58%; background: var(--metal); }
.menu { width: 36px; height: 36px; border-radius: 9px; background: var(--surface2); display:flex; align-items:center; justify-content:center; font: 900 16px/1 Archivo; color: var(--text2); }
</style></head><body><div class="page" style="height:844px">
  <img class="shot" id="shot">
  <div class="hd"><div class="grow"><div class="nm" id="nm"></div><div class="row g8 mt6"><span class="lchip" id="chip" style="height:20px;font-size:10.5px;padding:0 8px 0 6px"></span><span class="cap" style="font-size:10px">Round 2 of 6</span></div></div>
    <div class="sc"><b id="sc"></b><small>2ND · −14</small></div><div class="menu">?</div></div>
  <div class="bar"><i></i></div>
</div>
<script>
const q = new URLSearchParams(location.search); const lv = +(q.get("lv") || 2); const names = ["","Easy","Normal","Hard","Expert"];
document.getElementById("shot").src = "dirn/games/" + (q.get("img") || "sudoku-spotlight") + ".webp";
document.getElementById("nm").textContent = q.get("name") || "Box Six"; document.getElementById("sc").textContent = q.get("score") || "412";
const c = document.getElementById("chip"); c.classList.add("l" + lv); c.innerHTML = `<span class="lvl l${lv}" style="height:11px"><i></i><i></i><i></i><i></i></span>${names[lv]}`;
</script></body></html>
