<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="game.css"><script>const Q=new URLSearchParams(location.search);document.documentElement.dataset.dir = Q.get("dir") || "a";document.documentElement.dataset.v = Q.get("v") || "1";</script>
<style>
body.game { --g0:#FFA24D; --g1:#F0582E; --g2:#3A1560; }
.hd { text-align:center; padding-top: 70px; position:relative; }
.hd .rays { inset:-140px -60px auto -60px; height:640px; opacity:.2; }
.hd h1 { font: 900 50px/1 "Archivo"; font-stretch:118%; color:#FFE570; text-shadow:0 5px 0 rgba(120,30,0,.6); position:relative; }

.stars3 .star { width:60px; height:60px; filter: drop-shadow(0 4px 0 rgba(0,0,0,.25)); }

.act { position:absolute; left:16px; right:16px; bottom:26px; display:flex; flex-direction:column; gap:14px; }

</style></head><body class="game"><div class="page">

  <div class="hd"><div class="rays"></div><h1>Nice one!</h1><div class="num">172</div><div class="stars3"><i class="star"></i></div><div class="say">Your first star. 248 to collect.</div></div>
  <div class="act"><div class="btn big full">Play a real opponent</div><div class="btn sec full">Try another game</div><div class="cap2">No account needed</div></div>
