<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="game.css"><script>const Q=new URLSearchParams(location.search);document.documentElement.dataset.dir = Q.get("dir") || "a";</script>
<style>
@font-face { font-family:"Silkscreen"; font-weight:700; src:url("pub/fonts/silkscreen-700-latin.woff2") format("woff2"); }
body { background: radial-gradient(70% 90% at 50% 100%, #5B1FA8 0%, #1B1464 45%, #0A0728 100%); }
