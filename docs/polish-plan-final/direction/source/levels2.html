<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
body { background: radial-gradient(120% 55% at 50% -8%, color-mix(in srgb, var(--logic) 26%, #0A1126) 0%, var(--bg) 60%); }
.prev { margin: 12px auto 0; width: 264px; height: 264px; border-radius: 16px; padding: 10px; background: #0B1F2A; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--hard) 75%, transparent), 0 18px 40px rgba(0,0,0,.5); display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; position: relative; }
.prev i { border-radius: 6px; background: #12313D; display: flex; align-items: center; justify-content: center; font: 800 20px/1 "Archivo"; font-style: normal; color: #06242C; }
.prev i.g { background: #E9FBF7; }
.prev i:nth-child(6n+4) { margin-left: 3px; } .prev i:nth-child(n+13):nth-child(-n+18), .prev i:nth-child(n+25):nth-child(-n+30) { margin-top: 3px; }
.tag { position: absolute; left: 50%; bottom: -13px; transform: translateX(-50%); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg div { height: 62px; border-radius: 10px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; font: 800 13px/1 "Archivo"; color: var(--text2); }
.seg div.on { color: var(--text); background: color-mix(in srgb, var(--lc) 20%, var(--surface)); box-shadow: inset 0 0 0 2px var(--lc); }
.what { text-align: center; font: 800 21px/1.2 "Archivo"; }
.vs { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; text-align: center; }
.vs div { padding: 9px 0 8px; border-radius: 10px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
.vs b { display: block; font: 900 20px/1 "Archivo"; font-variant-numeric: tabular-nums; } .vs small { display: block; margin-top: 4px; font: 700 10px/1 "Archivo"; letter-spacing: .08em; color: var(--text3); text-transform: uppercase; }
.vs div.on { box-shadow: inset 0 0 0 1.5px var(--hard); } .vs div.on b { color: var(--hard); }
</style></head><body><div class="page">
  <div class="row g12"><div class="back">‹</div><div class="grow"><h2>Box Six</h2><div class="cap mt6" style="color:var(--logic)">Logic · 6 × 6</div></div><span class="pill gold"><span class="star" style="width:12px;height:12px"></span> Best 182</span></div>
  <div class="prev" id="prev"><span class="lchip l3 tag"><span class="lvl l3"><i></i><i></i><i></i><i></i></span>Hard</span></div>
  <div class="what" style="margin-top:30px">Only 10 numbers to start</div>
  <div class="sub mt6" style="text-align:center">Normal starts with 14. The clock is 75 s.</div>
  <div class="vs mt14"><div><b>20</b><small>Easy</small></div><div><b>14</b><small>Normal</small></div><div class="on"><b>10</b><small>Hard</small></div><div><b>8</b><small>Expert</small></div></div>
  <div class="seg mt10">
    <div class="l1"><span class="lvl l1"><i></i><i></i><i></i><i></i></span>Easy</div>
    <div class="l2"><span class="lvl l2"><i></i><i></i><i></i><i></i></span>Normal</div>
    <div class="l3 on"><span class="lvl l3"><i></i><i></i><i></i><i></i></span>Hard</div>
    <div class="l4"><span class="lvl l4"><i></i><i></i><i></i><i></i></span>Expert</div>
  </div>
  <div class="btn full mt14">Play Hard</div>
  <div class="row g8 mt10"><div class="btn sec sm grow">How to play</div><div class="btn sec sm grow">Challenges 1 / 3</div></div>
  <div class="tabs"><div class="tab"><img src="pub/nav/home-3x.webp">Home</div><div class="tab on"><img src="pub/nav/games-3x.webp">Games</div><div class="tab"><img src="pub/nav/tournaments-3x.webp">Compete</div><div class="tab"><img src="pub/nav/shop-3x.webp">Shop</div><div class="tab"><img src="pub/nav/profile-3x.webp">You</div></div>
</div>
<script>
const giv = {1:3,4:5,8:6,11:2,14:4,19:1,22:6,27:3,30:5,33:2};
let h = ""; for (let i = 0; i < 36; i++) h += giv[i] ? `<i class="g">${giv[i]}</i>` : "<i></i>";
document.getElementById("prev").insertAdjacentHTML("afterbegin", h);
</script></body></html>
