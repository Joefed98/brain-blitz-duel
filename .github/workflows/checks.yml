# Full check suite (scripts/run-checks.ts) split into parallel shards.
# Shard lists: .github/ci/shards.ts. Free plan: keep runs rare and short.
name: Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "screenshots/**"
      - "**/*.md"
      - ".lovable/**"
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The repo doesn't pin Bun; this matches the version Claude Code cloud sessions use.
  BUN_VERSION: "1.4.2"

jobs:
  checks:
    name: checks (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [snip, a, b, c]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ env.BUN_VERSION }}-

      # bun.lock pins some packages to Lovable's private npm cache (403 outside
      # Lovable). Point them at the public registry for the install only (same
      # versions and integrity hashes), then restore the lockfile exactly.
      - name: Install dependencies
        run: |
          cp bun.lock "$RUNNER_TEMP/bun.lock.orig"
          sed -i -E 's#https://europe-west[0-9]+-npm\.pkg\.dev/lovable-core-prod/[^/]+/#https://registry.npmjs.org/#g' bun.lock
          bun install --frozen-lockfile
          cp "$RUNNER_TEMP/bun.lock.orig" bun.lock
          git diff --exit-code -- bun.lock

      - name: Run checks (${{ matrix.shard }})
        run: bun .github/ci/run-shard.ts ${{ matrix.shard }} 2>&1 | tee ci-results-${{ matrix.shard }}.log
        shell: bash

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: check-logs-${{ matrix.shard }}
          path: |
            ci-results/
            ci-results-${{ matrix.shard }}.log
          retention-days: 7
