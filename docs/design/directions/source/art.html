<!doctype html>
<!-- Joulz art kit renderer (round 1 sketch). One raymarched 3D scene per icon, one key light from the
     top left, three material styles: 0 clay (matte, soft), 1 gloss (vinyl toy), 2 toon (stepped, outlined).
     render.mjs drives window.renderArt() and saves PNGs; nothing here is app code. -->
<meta charset="utf-8"><canvas id="c"></canvas>
<script id="fs" type="x-shader">#version 300 es
precision highp float;
out vec4 o;
uniform vec2 uRes; uniform int uScene; uniform int uStyle;
uniform vec3 uCol[8]; uniform float uYaw, uPitch, uZoom, uGround, uLookY; uniform vec3 uBall;

mat3 rotY(float a){float c=cos(a),s=sin(a);return mat3(c,0,-s,0,1,0,s,0,c);}
mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1,0,0,0,c,s,0,-s,c);}
mat3 rotZ(float a){float c=cos(a),s=sin(a);return mat3(c,s,0,-s,c,0,0,0,1);}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
vec2 U(vec2 a,vec2 b){return a.x<b.x?a:b;}
float sdSphere(vec3 p,float r){return length(p)-r;}
float sdRBox(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}
float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float sdRCyl(vec3 p,float r,float h,float rr){vec2 d=vec2(length(p.xz)-r+rr,abs(p.y)-h+rr);return min(max(d.x,d.y),0.)+length(max(d,0.))-rr;}
float sdRCylZ(vec3 p,float r,float h,float rr){return sdRCyl(p.xzy,r,h,rr);}
float sdTorusZ(vec3 p,float R,float r){vec2 q=vec2(length(p.xy)-R,p.z);return length(q)-r;}
float sdPoly(vec2 p,vec2 v[10],int n){float d=dot(p-v[0],p-v[0]);float s=1.;
 for(int i=0,j=n-1;i<n;j=i,i++){vec2 e=v[j]-v[i];vec2 w=p-v[i];vec2 b=w-e*clamp(dot(w,e)/dot(e,e),0.,1.);d=min(d,dot(b,b));
  bvec3 c=bvec3(p.y>=v[i].y,p.y<v[j].y,e.x*w.y>e.y*w.x);if(all(c)||all(not(c)))s*=-1.;}return s*sqrt(d);}
float extrude(float d2,float z,float h,float r){vec2 w=vec2(d2+r,abs(z)-h+r);return min(max(w.x,w.y),0.)+length(max(w,0.))-r;}
float sdBolt(vec3 p,float s,float h){vec2 v[10];
 v[0]=vec2(-.075,1.);v[1]=vec2(.425,1.);v[2]=vec2(.075,.2);v[3]=vec2(.425,.2);v[4]=vec2(-.325,-1.);v[5]=vec2(-.075,-.1);v[6]=vec2(-.425,-.1);
 return extrude(sdPoly(p.xy/s,v,7)*s,p.z,h,.05);}
float sdStar(vec3 p,float s,float h){vec2 v[10];for(int i=0;i<10;i++){float a=1.5708+float(i)*.6283;float r=(i%2==0)?1.:.45;v[i]=vec2(cos(a),sin(a))*r;}
 return extrude(sdPoly(p.xy/s,v,10)*s,p.z,h,.03);}
float sdShield(vec3 p,float h){vec2 v[10];v[0]=vec2(-.78,.88);v[1]=vec2(.78,.88);v[2]=vec2(.76,.05);v[3]=vec2(.42,-.6);v[4]=vec2(0.,-.95);v[5]=vec2(-.42,-.6);v[6]=vec2(-.76,.05);
 return extrude(sdPoly(p.xy,v,7),p.z,h,.1);}
float sdGem(vec3 p){float d=length(p.xz)-.95;d=max(d,p.y-.42);
 for(int i=0;i<8;i++){float a=float(i)*.7854;d=max(d,dot(p,normalize(vec3(cos(a),-.78,sin(a))))-.5);
  d=max(d,dot(p,normalize(vec3(cos(a+.3927),.95,sin(a+.3927))))-.66);}return d;}


const vec3 TB0=vec3(-.78,0.,0.), TB1=vec3(0.,0.,0.);
mat3 tubeTilt(){return rotZ(-.75);}
vec3 TB2(){return vec3(.62,.62,0.);}
vec2 scene(vec3 p){
 vec2 r=vec2(1e9,0.);
 if(uScene==0){r=vec2(sdBolt(p,1.,.2),0.);}
 else if(uScene==1){
  r=vec2(sdRBox(p-vec3(0,-.95,0),vec3(.55,.14,.4),.06),1.);
  float g=sdRCyl(p-vec3(0,-.62,0),.12,.22,.04);g=min(g,sdRCyl(p-vec3(0,-.4,0),.3,.06,.03));
  float cup=smin(sdRCyl(p-vec3(0,.3,0),.6,.45,.08),sdSphere(p-vec3(0,0.,0),.6),.2);
  cup=max(cup,-sdRCyl(p-vec3(0,.55,0),.5,.45,.02));
  cup=min(cup,sdTorusZ(p-vec3(.62,.32,0),.22,.065));cup=min(cup,sdTorusZ(p-vec3(-.62,.32,0),.22,.065));
  r=U(r,vec2(min(g,cup),0.));
  r=U(r,vec2(sdStar(p-vec3(0,.28,.6),.2,.06),5.));}
 else if(uScene==2){
  r=vec2(sdRCylZ(p,.82,.15,.06),1.);
  r=U(r,vec2(sdTorusZ(p,.84,.12),0.));
  r=U(r,vec2(sdRBox(p-vec3(0,1.07,0),vec3(.13,.11,.11),.04),0.));
  r=U(r,vec2(sdRBox(p-vec3(0,.94,0),vec3(.2,.05,.09),.03),2.));
  r=U(r,vec2(sdRBox(rotZ(.75)*(p-vec3(.66,.7,0)),vec3(.09,.12,.09),.04),0.));
  r=U(r,vec2(sdRBox(p-vec3(0,.25,.16),vec3(.045,.32,.03),.02),2.));
  r=U(r,vec2(sdRBox(rotZ(-1.0)*(p-vec3(.2,-.12,.18))-vec3(0,0,0),vec3(.035,.25,.025),.015),3.));
  r=U(r,vec2(sdRCylZ(p-vec3(0,0,.19),.08,.04,.02),2.));}
 else if(uScene==3){
  r=vec2(sdRCylZ(p,.95,.1,.05),3.);
  r=U(r,vec2(sdRCylZ(p-vec3(0,0,.06),.72,.1,.05),1.));
  r=U(r,vec2(sdRCylZ(p-vec3(0,0,.12),.5,.1,.05),3.));
  r=U(r,vec2(sdRCylZ(p-vec3(0,0,.18),.28,.1,.05),1.));
  r=U(r,vec2(sdRCylZ(p-vec3(0,0,.24),.12,.1,.04),3.));
  vec3 a=vec3(.04,.04,.3),b=vec3(.62,.5,1.1);
  r=U(r,vec2(sdCap(p,a,b,.05),2.));
  vec3 q=p-b;r=U(r,vec2(min(sdRBox(q-vec3(.08,0,0),vec3(.12,.02,.14),.02),sdRBox(q-vec3(0,.08,0),vec3(.02,.12,.14),.02)),0.));}
 else if(uScene==4){
  r=vec2(sdRBox(p-vec3(0,-.12,0),vec3(.82,.72,.16),.14),1.);
  r=U(r,vec2(sdRBox(p-vec3(0,.52,.01),vec3(.82,.24,.18),.12),3.));
  r=U(r,vec2(sdCap(p,vec3(.42,.55,.0),vec3(.42,.92,.0),.075),2.));
  r=U(r,vec2(sdCap(p,vec3(-.42,.55,.0),vec3(-.42,.92,.0),.075),2.));
  for(int i=0;i<3;i++)for(int j=0;j<2;j++){vec3 c=vec3(-.46+.46*float(i),-.02-.42*float(j),.17);
   float m=(i==1&&j==1)?0.:4.;r=U(r,vec2(sdRBox(p-c,vec3(.15,.13,.06),.05),m));}}
 else if(uScene==5){
  vec3 q=(p-vec3(-.38,.08,-.35))/.86;
  float b=smin(sdSphere(q-vec3(0,.55,0),.32),sdRBox(q-vec3(0,-.42,0),vec3(.46,.38,.28),.26),.04)*.86;
  r=vec2(b,3.);r=U(r,vec2(sdSphere(q-vec3(0,.55,0),.33)*.86,5.));
  q=p-vec3(.32,-.18,.32);
  r=U(r,vec2(sdRBox(q-vec3(0,-.42,0),vec3(.48,.4,.3),.28),0.));r=U(r,vec2(sdSphere(q-vec3(0,.56,0),.34),4.));}
 else if(uScene==6){
  float d=sdRBox(p,vec3(.58,.58,.16),.1);
  d=smin(d,sdRCylZ(p-vec3(.74,0,0),.25,.16,.06),.06);d=smin(d,sdRCylZ(p-vec3(0,.74,0),.25,.16,.06),.06);
  d=max(d,-sdRCylZ(p-vec3(-.66,0,0),.25,.3,.02));d=max(d,-sdRCylZ(p-vec3(0,-.66,0),.25,.3,.02));
  r=vec2(d,0.);}
 else if(uScene==7){
  r=vec2(sdRBox(p-vec3(0,-.78,0),vec3(.9,.24,.62),.16),1.);
  r=U(r,vec2(sdCap(p,vec3(-.15,-.55,0),vec3(-.15,.25,0),.09),2.));
  r=U(r,vec2(sdSphere(p-vec3(-.15,.42,0),.34),3.));
  r=U(r,vec2(sdRCyl(p-vec3(.52,-.52,.22),.13,.06,.03),0.));
  r=U(r,vec2(sdRCyl(p-vec3(.52,-.52,-.16),.13,.06,.03),4.));}
 else if(uScene==8){
  float d=sdRCylZ(p,.9,.13,.06);d=max(d,-sdTorusZ(p-vec3(0,0,.14),.74,.03));
  r=vec2(d,0.);r=U(r,vec2(sdBolt(p-vec3(0,0,.06),.52,.13),5.));}
 else if(uScene==9){r=vec2(sdGem(p),0.);}
 else if(uScene==10){
  r=vec2(sdRBox(rotZ(.4)*(p-vec3(-.25,.62,-.05)),vec3(.18,.42,.04),.03),3.);
  r=U(r,vec2(sdRBox(rotZ(-.4)*(p-vec3(.25,.62,-.1)),vec3(.18,.42,.04),.03),4.));
  r=U(r,vec2(sdRCylZ(p-vec3(0,-.2,0),.58,.1,.05),0.));
  r=U(r,vec2(sdStar(p-vec3(0,-.2,.1),.34,.06),5.));}
 else if(uScene==11){
  r=vec2(sdRCyl(p-vec3(0,-.78,0),1.55,.15,.08),1.);
  r=U(r,vec2(sdRCyl(p-vec3(0,-.58,0),1.25,.06,.04),7.));
  r=U(r,vec2(sdBolt(rotY(-.25)*(p-vec3(-.05,.5,0)),1.08,.22),0.));
  r=U(r,vec2(sdSphere(p-vec3(1.0,-.12,.42),.4),6.));
  r=U(r,vec2(sdRBox(rotY(.6)*rotX(.12)*(p-vec3(-1.05,-.19,.38)),vec3(.32),.07),4.));
  r=U(r,vec2(sdRCylZ(rotY(.5)*rotX(-.2)*(p-vec3(.78,.95,-.35)),.28,.05,.03),5.));}
 else if(uScene==12){
  r=vec2(sdRBox(p-vec3(0,-.45,0),vec3(1.32,.12,1.32),.1),1.);
  for(int i=0;i<3;i++)for(int j=0;j<3;j++){int k=(i*3+j*2)%4;float h=.1+.08*float((i+j*2)%3);
   vec3 c=vec3(-.84+.84*float(i),-.33+h,-.84+.84*float(j));
   r=U(r,vec2(sdRBox(p-c,vec3(.36,h,.36),.09),k==0?0.:(k==1?3.:(k==2?4.:5.))));}}
 else if(uScene==13){
  r=vec2(sdShield(p,.2),3.);r=U(r,vec2(sdBolt(p-vec3(0,0,.1),.55,.16),0.));}
 else if(uScene==14){
  r=vec2(sdRBox(p-vec3(0,-.62,0),vec3(2.4,.1,1.8),.06),1.);
  r=U(r,vec2(sdSphere(p-uBall,.5),6.));
  r=U(r,vec2(sdSphere(p-vec3(.62,-.02,-.3),.5),3.));
  r=U(r,vec2(sdSphere(p-vec3(.05,-.17,.78),.35),7.));}
 else if(uScene==15){
  r=vec2(sdRBox(p-vec3(-.36,-.86,0),vec3(.95,.1,.42),.08),1.);
  r=U(r,vec2(sdCap(p-TB0,vec3(0,-.7,0),vec3(0,.62,0),.27),7.));
  r=U(r,vec2(sdCap(p-TB1,vec3(0,-.7,0),vec3(0,.62,0),.27),7.));
  r=U(r,vec2(sdCap(tubeTilt()*(p-TB2()),vec3(0,-.62,0),vec3(0,.62,0),.27),7.));}
 return r;}

vec2 map(vec3 p){mat3 m=rotX(uPitch)*rotY(uYaw);return scene(m*p);}
vec3 nrm(vec3 p){vec2 e=vec2(.0015,-.0015);return normalize(e.xyy*map(p+e.xyy).x+e.yyx*map(p+e.yyx).x+e.yxy*map(p+e.yxy).x+e.xxx*map(p+e.xxx).x);}
float shadow(vec3 ro,vec3 rd){float res=1.,t=.02;for(int i=0;i<40;i++){float h=map(ro+rd*t).x;res=min(res,9.*h/t);t+=clamp(h,.02,.25);if(res<.002||t>6.)break;}return clamp(res,0.,1.);}
float ao(vec3 p,vec3 n){float o=0.,s=1.;for(int i=1;i<6;i++){float h=.04*float(i)*1.6;o+=(h-map(p+n*h).x)*s;s*=.7;}return clamp(1.-1.6*o,0.,1.);}
vec3 lin(vec3 c){return pow(c,vec3(2.2));}
vec3 baseCol(float m,vec3 p){int i=int(m+.5);vec3 c=uCol[i];
 if(i==6){vec3 q=rotX(uPitch)*rotY(uYaw)*p-uBall;float band=abs(q.y)<.17?1.:0.;c=mix(vec3(.96,.94,.9),uCol[6],band);
  if(length(q.xy-vec2(-.05,0.))<.14&&q.z>0.)c=vec3(.97,.95,.9);}
 if(i==7&&uScene==15){vec3 o=rotX(uPitch)*rotY(uYaw)*p;vec3 a=o-TB0,b2=o-TB1,cc=tubeTilt()*(o-TB2());
  float da=length(vec2(a.x,a.z)),db=length(vec2(b2.x,b2.z)),dc=length(vec2(cc.x,cc.z));int tb=0;vec3 l=a;
  if(db<da&&db<dc){tb=1;l=b2;} if(dc<da&&dc<db){tb=2;l=cc;}
  int lv=int(floor((l.y+.97)/.37));int fill=tb==0?4:(tb==1?3:2);
  vec3 cs[4];cs[0]=uCol[0];cs[1]=uCol[3];cs[2]=uCol[4];cs[3]=uCol[5];
  c=lv<fill?cs[(tb*2+lv)%4]:vec3(.80,.86,.88);}
 return lin(c);}

vec4 shade(vec2 frag){
 vec2 uv=(2.*frag-uRes)/uRes.y;
 vec3 ta=vec3(0,uLookY,0),ro=ta+vec3(0,.55,4.6)/uZoom;
 vec3 ww=normalize(ta-ro),uu=normalize(cross(ww,vec3(0,1,0))),vv=cross(uu,ww);
 vec3 rd=normalize(uv.x*uu+uv.y*vv+2.6*ww);
 vec3 L=normalize(vec3(-.55,.85,.6));
 float t=0.,minD=1e9,tm=0.;vec2 h;bool hit=false;
 for(int i=0;i<140;i++){h=map(ro+rd*t);if(h.x<minD){minD=h.x;tm=t;}if(h.x<.0008*t){hit=true;break;}t+=h.x*.9;if(t>12.)break;}
 if(!hit){
  if(uStyle==2&&minD<.022*(tm*.3))return vec4(lin(vec3(.11,.09,.08)),1.);
  float tp=(uGround-ro.y)/rd.y;
  if(tp>0.){vec3 p=ro+rd*tp;float s=shadow(p,L);
   float a;if(uStyle==2)a=(s<.5?.38:0.);else a=(1.-s)*.42;
   float occ=0.;for(int k=0;k<3;k++){occ+=max(0.,.25-map(p+vec3(0,.12*float(k+1),0)).x);} if(uStyle!=2)a=max(a,clamp(occ*.9,0.,.45));
   return vec4(vec3(0.),a);}
  return vec4(0.);}
 vec3 p=ro+rd*t,n=nrm(p);vec3 b=baseCol(h.y,p);
 float dif=clamp(dot(n,L),0.,1.),sh=shadow(p+n*.004,L),oc=ao(p,n);
 vec3 H=normalize(L-rd);float sp=clamp(dot(n,H),0.,1.);float fr=pow(1.-clamp(dot(n,-rd),0.,1.),3.);
 vec3 c;
 if(uStyle==0){float wrap=clamp((dot(n,L)+.4)/1.4,0.,1.);
  c=b*(.30*oc*(.65+.35*n.y)+.95*wrap*mix(.5,1.,sh))+.05*pow(sp,12.)*sh+.06*fr*oc*b;}
 else if(uStyle==1){vec3 rr=reflect(rd,n);
  c=b*(.24*oc*(.6+.4*n.y)+.95*dif*mix(.35,1.,sh))+vec3(1.)*.95*pow(sp,80.)*sh+.22*fr*oc+.10*smoothstep(.1,.9,rr.y)*oc;}
 else {float q=dif*sh;float s=q>.5?1.:(q>.12?.74:.54);c=b*s*(.86+.14*oc);
  if(pow(sp,40.)>.85)c=mix(c,vec3(1.),.6);
  if(dot(n,-rd)<.26)c=lin(vec3(.11,.09,.08));}
 c=c/(1.+.15*c);c=pow(c,vec3(1./2.2));return vec4(c,1.);}

void main(){vec4 acc=vec4(0.);
 for(int i=0;i<2;i++)for(int j=0;j<2;j++){vec4 s=shade(gl_FragCoord.xy+vec2(float(i),float(j))*.5-.25);acc+=vec4(s.rgb*s.a,s.a);}
 acc/=4.;o=acc;}
</script>
<script>
const cv=document.getElementById('c');
const gl=cv.getContext('webgl2',{preserveDrawingBuffer:true,premultipliedAlpha:true,alpha:true});
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(x));return x;}
const pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,'#version 300 es\nin vec2 a;void main(){gl_Position=vec4(a,0,1);}'));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent.trim()));
gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(pr));
gl.useProgram(pr);
const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
const u=n=>gl.getUniformLocation(pr,n);
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)/255);
window.renderArt=({scene,style,cols,w,h,yaw=0,pitch=0,zoom=1,ground=-1.1,lookY=0,ball=[1.0,-.12,.42]})=>{
 cv.width=w;cv.height=h;gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
 gl.uniform2f(u('uRes'),w,h);gl.uniform1i(u('uScene'),scene);gl.uniform1i(u('uStyle'),style);
 const c=[];for(let i=0;i<8;i++)c.push(...hex(cols[i]||'#808080'));gl.uniform3fv(u('uCol'),new Float32Array(c));
 gl.uniform1f(u('uYaw'),yaw);gl.uniform1f(u('uPitch'),pitch);gl.uniform1f(u('uZoom'),zoom);gl.uniform1f(u('uGround'),ground);gl.uniform1f(u('uLookY'),lookY);gl.uniform3f(u('uBall'),...ball);
 gl.drawArrays(gl.TRIANGLES,0,3);gl.finish();return cv.toDataURL('image/png');};
window.ready=true;
</script>
