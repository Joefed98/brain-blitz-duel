<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="game.css"><script>document.documentElement.dataset.dir = new URLSearchParams(location.search).get("dir") || "a";</script>
<style>
body.game { --g0:#3FE0C5; --g1:#17958C; --g2:#122260; }
.hd { text-align:center; padding-top: 18px; position:relative; }
.hd .rays { inset:-140px -60px auto -60px; height:520px; opacity:.2; }
.hd h2 { font-size:22px; color:#fff; position:relative; }
.num { font: 900 96px/1 "Archivo"; font-stretch:116%; color:#fff; text-shadow: 0 6px 0 rgba(8,60,70,.55); position:relative; margin-top:4px; }
.stars3 { display:flex; justify-content:center; gap:10px; margin-top:8px; position:relative; }

.parts { display:flex; gap:8px; padding: 14px 16px 0; }

.parts b { font: 900 22px "Archivo"; } .parts span { font-size:12.5px; font-weight:800; opacity:.9; }

.sd div.alt { background:#DDF6F0; } .sd div.me { color:#0FA08F; }

</div>
<script>
