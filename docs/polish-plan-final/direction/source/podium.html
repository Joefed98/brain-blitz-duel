<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
body { background: radial-gradient(110% 46% at 50% 0%, #2A2412 0%, #0A1126 38%, var(--bg) 70%); }
.pod { display: grid; grid-template-columns: 1fr 1.14fr 1fr; gap: 8px; align-items: end; margin-top: 16px; }
.p { text-align: center; } .p .av { width: 64px; height: 64px; border-radius: 16px; margin: 0 auto; } .p.one .av { width: 84px; height: 84px; border-radius: 20px; }
.p .nm { font: 800 14px/1 "Archivo"; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .p .pts { font: 900 22px/1 "Archivo"; font-variant-numeric: tabular-nums; margin-top: 5px; } .p.one .pts { font-size: 30px; color: var(--gold-hi); }
.blk { margin-top: 10px; background: linear-gradient(180deg, var(--surface2), var(--surface)); box-shadow: inset 0 0 0 1px var(--edge); clip-path: polygon(10px 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%, 0 10px); display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; }
.blk img { width: 44px; height: 44px; } .one .blk { height: 132px; background: linear-gradient(180deg, #3A3118, var(--surface)); box-shadow: inset 0 0 0 1px var(--ledge); } .two .blk { height: 98px; } .three .blk { height: 76px; }
.you { padding: 12px 14px; } .aw { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .aw div { padding: 10px 12px; border-radius: 10px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); } .aw b { display: block; font: 800 13.5px/1 Archivo; } .aw small { display: block; margin-top: 5px; font: 600 12px/1 Archivo; color: var(--text3); }
.foot { position: absolute; left: 16px; right: 16px; bottom: 26px; }
</style></head><body><div class="page">
  <div style="text-align:center"><div class="cap" style="color:var(--gold)">Final · 9 rounds</div><h1 class="mt6">NovaStrike wins</h1></div>
  <div class="pod">
    <div class="p two"><div class="av" style="--c:#E2C07A"><img src="art/avatars/svg/captain-joulz.svg"></div><div class="nm">TheInventor</div><div class="pts">1,268</div><div class="blk"><img src="art/svg/medal-silver.svg"></div></div>
    <div class="p one"><div class="av" style="--c:#36E2F5"><img src="art/avatars/svg/gemstone.svg"></div><div class="nm">NovaStrike</div><div class="pts">1,304</div><div class="blk"><img src="art/svg/medal-gold.svg" style="width:56px;height:56px"></div></div>
    <div class="p three"><div class="av" style="--c:#FF6BD6"><img src="art/avatars/svg/orbit.svg"></div><div class="nm">Sam_Speed</div><div class="pts">1,190</div><div class="blk"><img src="art/svg/medal-bronze.svg"></div></div>
  </div>
  <div class="panel you mt14"><div class="row"><div class="grow"><div class="cap">You came</div><div style="font:900 26px/1 Archivo;margin-top:6px">2nd <span style="color:var(--text3);font-weight:700;font-size:15px">of 6 · 36 behind</span></div></div><span class="pill gold">+ 120 Joules</span></div></div>
  <div class="aw mt10"><div><b>⚡ Fastest Finger</b><small>You · Box Six in 38 s</small></div><div><b>◎ Perfectionist</b><small>NovaStrike · two 200s</small></div></div>
  <div class="col g6 mt10"><div class="plate" style="height:40px;--c:#3DDC84"><span class="n" style="width:22px;text-align:center;color:var(--text3)">4</span><b class="grow">Priya_K</b><span class="n">1,102</span></div><div class="plate" style="height:40px;--c:#FF8A3D"><span class="n" style="width:22px;text-align:center;color:var(--text3)">5</span><b class="grow">Mo</b><span class="n">988</span></div><div class="plate" style="height:40px;--c:#8E80FF"><span class="n" style="width:22px;text-align:center;color:var(--text3)">6</span><b class="grow">Lena</b><span class="n">901</span></div></div>
  <div class="foot"><div class="btn full">Play again</div><div class="row g8 mt10"><div class="btn sec sm grow">Share</div><div class="btn sec sm grow">Challenge</div><div class="btn sec sm grow">Standings</div></div></div>
</div></body></html>
