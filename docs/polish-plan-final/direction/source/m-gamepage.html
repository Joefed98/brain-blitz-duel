<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
body { background: radial-gradient(120% 55% at 50% -8%, color-mix(in srgb, var(--retro) 24%, #0A1126) 0%, var(--bg) 60%); }
.big { margin: 12px auto 0; width: 250px; height: 250px; border-radius: 16px; background: #050818; position: relative; overflow: hidden; box-shadow: inset 0 0 0 2px var(--normal), 0 18px 40px rgba(0,0,0,.5); }
.big .w { position:absolute; left:14px; right:14px; top:14px; display:grid; grid-template-columns:repeat(9,1fr); gap:3px; } .big .w i { height:10px; border-radius:2px; }
.big .p { position:absolute; bottom:18px; left:50%; transform:translateX(-50%); height:8px; border-radius:4px; background:var(--gold); } .big .b { position:absolute; width:8px; height:8px; background:#fff; border-radius:2px; bottom:60px; left:58%; }
.tag { position:absolute; left:50%; bottom:-13px; transform:translateX(-50%); z-index:2; white-space:nowrap; }
.what { text-align:center; font:800 21px/1.2 Archivo; }
.rowlv { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.lv { border-radius:10px; padding:6px 6px 8px; background:var(--surface); box-shadow:inset 0 0 0 1px var(--line); text-align:center; }
.lv.on { background:color-mix(in srgb,var(--lc) 18%,var(--surface)); box-shadow:inset 0 0 0 2px var(--lc); }
.mini { height:56px; border-radius:6px; background:#050818; position:relative; overflow:hidden; } .mini .w { position:absolute; left:4px; right:4px; top:4px; display:grid; grid-template-columns:repeat(9,1fr); gap:1px; } .mini .w i { height:3px; border-radius:1px; } .mini .p { position:absolute; bottom:5px; left:50%; transform:translateX(-50%); height:3px; border-radius:2px; background:var(--gold); }
.lv .n { display:flex; align-items:center; justify-content:center; gap:5px; font:800 11.5px/1 Archivo; margin-top:7px; } .lv .s { display:flex; align-items:center; justify-content:center; gap:4px; font:800 12.5px/1 Archivo; margin-top:6px; font-variant-numeric:tabular-nums; color:var(--text2); }
</style></head><body><div class="page">
  <div class="row g12"><div class="back">‹</div><div class="tile" style="width:44px;--c:var(--retro);border-radius:10px;flex:none"><img src="pub/tiles/breaker.webp"></div><div class="grow"><h2>Breaker</h2><div class="cap mt6" style="color:var(--retro)">Retro · 90 seconds</div></div><div class="btn sec sm" style="padding:0 12px">?</div></div>
  <div style="position:relative;width:250px;margin:0 auto"><div class="big" id="big"></div><span class="lchip l2 tag"><span class="lvl l2"><i></i><i></i><i></i><i></i></span>Normal · your level</span></div>
  <div class="what" style="margin-top:28px">9 rows of bricks</div>
  <div class="sub mt6" style="text-align:center">The ranked game. Best 148 <span class="star" style="width:12px;height:12px;vertical-align:-1px"></span></div>
  <div class="rowlv mt14" id="rowlv"></div>
  <div class="btn full mt14" style="height:60px;font-size:21px">Play Normal</div>
  <div class="row g8 mt10"><div class="btn sec sm grow">How to play</div><div class="btn sec sm grow">Challenges 1 / 3</div></div>
  <div class="tabs"><div class="tab"><img src="pub/nav/home-3x.webp">Home</div><div class="tab on"><img src="pub/nav/games-3x.webp">Games</div><div class="tab"><img src="pub/nav/tournaments-3x.webp">Compete</div><div class="tab"><img src="pub/nav/shop-3x.webp">Shop</div><div class="tab"><img src="pub/nav/profile-3x.webp">You</div></div>
</div>
<script>
const cols=["#FF4D6A","#FF8A3D","#FFC81E","#3DDC84","#36E2F5","#4D8CFF","#B26BFF","#FF6BD6","#FF4D6A","#FF8A3D","#FFC81E","#3DDC84"];
const wall=(rows,sl)=>{let w="";for(let r=0;r<rows;r++)for(let c=0;c<9;c++)w+='<i style="background:'+cols[r]+';'+(sl.includes(r)?'transform:translateX('+(r%2?3:-3)+'px)':'')+'"></i>';return w;};
document.getElementById("big").innerHTML='<div class="w">'+wall(9,[])+'</div><div class="b"></div><div class="p" style="width:58px"></div>';
const L=[["Easy",1,6,26,"184","star",[]],["Normal",2,9,19,"148","star",[]],["Hard",3,11,12,"—","off",[8,10]],["Expert",4,12,8,"—","crown",[6,8,9,11]]];
document.getElementById("rowlv").innerHTML=L.map(([n,l,rows,pw,best,st,sl])=>'<div class="lv l'+l+(l==2?' on':'')+'"><div class="mini"><div class="w">'+wall(rows,sl)+'</div><div class="p" style="width:'+pw+'px"></div></div><div class="n"><span class="lvl l'+l+'" style="height:10px"><i></i><i></i><i></i><i></i></span>'+n+'</div><div class="s">'+(st=="star"?'<span class="star" style="width:11px;height:11px"></span>':st=="off"?'<span class="star off" style="width:11px;height:11px"></span>':'<span class="crown off" style="width:13px;height:10px"></span>')+best+'</div></div>').join("");
</script></body></html>
