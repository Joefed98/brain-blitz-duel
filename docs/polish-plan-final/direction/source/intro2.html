<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
body { background: radial-gradient(120% 55% at 50% -8%, color-mix(in srgb, var(--strategy) 30%, #0A1126) 0%, var(--bg) 60%); }
.demo { height: 330px; border-radius: 16px; overflow: hidden; position: relative; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--strategy) 60%, transparent); background: #0B0B1E; }
.demo img { position: absolute; left: 50%; top: -92px; width: 330px; transform: translateX(-50%); }
.demo .play { position: absolute; right: 10px; bottom: 10px; }
.goal { font: 800 24px/1.15 "Archivo"; text-align: center; }
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; } .how div { padding: 12px 4px 10px; border-radius: 10px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); font: 700 12.5px/1.2 "Archivo"; color: var(--text2); } .how b { display: block; font: 900 20px/1 "Archivo"; color: var(--text); margin-bottom: 6px; }
</style></head><body><div class="page" style="padding-bottom:20px">
  <div class="row g12"><div class="back">✕</div><div class="grow"><h2>Gemstone</h2><div class="row g8 mt6"><span class="lchip l2"><span class="lvl l2"><i></i><i></i><i></i><i></i></span>Normal</span><span class="cap">Round 2 of 6</span></div></div><span class="pill">90 s</span></div>
  <div class="demo mt14"><img src="dirn/games/matchup-spotlight.webp"><span class="pill play" style="background:rgba(4,6,12,.8)">▶ Demo</span></div>
  <div class="goal mt18">Swap gems to make lines of three.</div>
  <div class="how mt14"><div><b>3+</b>in a line</div><div><b>6</b>colour goals</div><div><b>×2</b>hits to break ice</div></div>
  <div class="sub mt14" style="text-align:center">Up to 200 points. <span style="color:var(--text3)">More · ?</span></div>
  <div class="btn full mt14" style="height:62px;font-size:22px">Ready</div>
  <div class="row g6 mt10" style="justify-content:center"><div class="av" style="width:26px;height:26px;border-radius:8px;--c:var(--win)"><img src="art/avatars/svg/gemstone.svg"></div><div class="av" style="width:26px;height:26px;border-radius:8px;--c:var(--win)"><img src="art/avatars/svg/orbit.svg"></div><div class="av" style="width:26px;height:26px;border-radius:8px"><img src="art/avatars/svg/pinball.svg"></div><span class="sub" style="font-size:12.5px;margin-left:4px">2 of 4 ready</span></div>
</div></body></html>
