<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
.hero { padding: 16px 16px 18px; } .hero .art { position:absolute; right: 10px; top: 8px; width: 104px; height: 104px; object-fit: contain; }
.hero h2 { font-size: 26px; } .tiles { display: flex; gap: 6px; margin-top: 12px; } .tiles .tile { width: 40px; border-radius: 9px; box-shadow: 0 0 0 1.5px var(--c); }
.done { padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.streak { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; } .streak div { height: 44px; border-radius: 8px; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 700 10px/1 "Archivo"; color: var(--text3); } .streak div.y { background: color-mix(in srgb, var(--gold) 14%, var(--raised)); box-shadow: inset 0 0 0 1px var(--ledge); color: var(--gold-hi); } .streak div.t { box-shadow: inset 0 0 0 2px var(--gold); color: var(--text); }
</style></head><body><div class="page">
  <div class="row g12"><div class="back">‹</div><div class="grow"><h2>Daily</h2><div class="cap mt6">Fri 20 Nov · closes in 9 h 12 min</div></div><span class="pill gold">🔥 4</span></div>
  <div class="cut hero mt14" style="background:linear-gradient(160deg,color-mix(in srgb,var(--pattern) 34%,#101A33) 0%,var(--surface) 60%,#0B1226 100%)"><img class="art" src="pub/home/dailyPuzzle-3x.webp" onerror="this.remove()"><div class="cap" style="color:var(--gold)">Today's Daily Puzzle</div><h2 class="mt6">6 rounds</h2><div class="sub mt6">12,431 played today</div>
    <div class="tiles"><div class="tile" style="--c:var(--word)"><img src="pub/tiles/wordhunt.webp"></div><div class="tile" style="--c:var(--number)"><img src="pub/tiles/target.webp"></div><div class="tile" style="--c:var(--speed)"><img src="pub/tiles/numhunt.webp"></div><div class="tile" style="--c:var(--attention)"><img src="pub/tiles/spotdiff.webp"></div><div class="tile" style="--c:var(--pattern)"><img src="pub/tiles/maze.webp"></div><div class="tile" style="--c:var(--logic)"><img src="pub/tiles/sudoku.webp"></div></div>
    <div class="btn mt14" style="width:168px">Play</div></div>
  <div class="panel done mt10"><div class="tile" style="width:52px;--c:var(--retro);border-radius:12px"><img src="pub/tiles/breaker.webp"></div><div class="grow"><div class="cap">Daily Arcade · done</div><div style="font:900 24px/1 Archivo;margin-top:6px;font-variant-numeric:tabular-nums">512 <span style="font:700 13px/1 Archivo;color:var(--text3)">#1,204 of 9,870</span></div></div><div class="btn sec sm">Board</div></div>
  <div class="cap mt18">Your week</div>
  <div class="streak mt10"><div class="y">M<span class="star" style="width:11px;height:11px"></span></div><div class="y">T<span class="star" style="width:11px;height:11px"></span></div><div class="y">W<span class="star" style="width:11px;height:11px"></span></div><div class="y">T<span class="star" style="width:11px;height:11px"></span></div><div class="t">F<span class="star off" style="width:11px;height:11px"></span></div><div>S</div><div>S</div></div>
  <div class="row mt18"><div class="cap grow">Today's top 100</div><span class="sub" style="font-size:13px">All ›</span></div>
  <div class="col g6 mt10"><div class="plate" style="--c:#36E2F5"><span class="n" style="width:22px;text-align:center;color:var(--gold)">1</span><div class="av" style="--c:#36E2F5;width:34px;height:34px;border-radius:9px"><img src="art/avatars/svg/gemstone.svg"></div><b class="grow">NovaStrike</b><span class="n">1,142</span></div><div class="plate" style="--c:#FF6BD6"><span class="n" style="width:22px;text-align:center;color:var(--text3)">2</span><div class="av" style="--c:#FF6BD6;width:34px;height:34px;border-radius:9px"><img src="art/avatars/svg/orbit.svg"></div><b class="grow">Sam_Speed</b><span class="n">1,128</span></div></div>
  <div class="tabs"><div class="tab"><img src="pub/nav/home-3x.webp">Home</div><div class="tab"><img src="pub/nav/games-3x.webp">Games</div><div class="tab on"><img src="pub/nav/tournaments-3x.webp">Compete</div><div class="tab"><img src="pub/nav/shop-3x.webp">Shop</div><div class="tab"><img src="pub/nav/profile-3x.webp">You</div></div>
</div></body></html>
